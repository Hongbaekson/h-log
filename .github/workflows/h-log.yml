name: H-Log CI

on:
  push:
    paths:
      - "apps/h-log/**"
      - ".github/workflows/h-log.yml"
  pull_request:
    paths:
      - "apps/h-log/**"
      - ".github/workflows/h-log.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/h-log
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: hlog_ci
          POSTGRES_USER: hlog_app
          POSTGRES_PASSWORD: hlog_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hlog_app -d hlog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://hlog_app:hlog_ci_password@127.0.0.1:5432/hlog_ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
