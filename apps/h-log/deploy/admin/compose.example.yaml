# Opt-in overlay: resolve paths relative to the base apps/h-log/compose.yaml.
# Inspect with `docker compose ... config --quiet`; do not apply without rollout approval.
services:
  hlog-admin-nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      hlog-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ${HLOG_ADMIN_NGINX_CONFIG:?Choose reviewed admin Nginx config}:/etc/nginx/conf.d/default.conf:ro
      - ${HLOG_ADMIN_TLS_DIR:?Choose private certificate directory}:/etc/nginx/admin-tls:ro
    networks:
      - admin_ingress_net
      - app_net
    restart: unless-stopped
networks:
  admin_ingress_net:
