apiVersion: 1
datasources:
  - name: H-Log Prometheus
    uid: hlog-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 60s
      queryTimeout: 10s
      prometheusType: Prometheus
      prometheusVersion: 3.13.5
