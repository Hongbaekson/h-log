scrape_configs:
- job_name: host
  static_configs:
    - targets: [node-exporter:9100]
  relabel_configs:
    - target_label: instance
      replacement: host
  metric_relabel_configs:
    - source_labels: [__name__]
      action: keep
      regex: node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_filesystem_files_free|node_filesystem_files
    - source_labels: [mountpoint]
      regex: /storage
      target_label: mountpoint
      replacement: docker-data
    - action: labelkeep
      regex: __name__|job|instance|cpu|mode|mountpoint

- job_name: database
  static_configs:
    - targets: [postgres-exporter:9187]
  relabel_configs:
    - target_label: instance
      replacement: database
  metric_relabel_configs:
    - source_labels: [__name__, datname]
      action: keep
      regex: pg_up;|pg_stat_database_numbackends;hlog
    - source_labels: [datname]
      regex: hlog
      target_label: database
      replacement: app
    - action: labelkeep
      regex: __name__|job|instance|database

- job_name: hlog
  static_configs:
    - targets: [hlog-metrics:9400]
  relabel_configs:
    - target_label: instance
      replacement: collector
  metric_relabel_configs:
    - source_labels: [__name__]
      action: keep
      regex: hlog_metrics_collection_success|hlog_metrics_collected_timestamp_seconds|hlog_metrics_source_state|hlog_db_max_connections|hlog_db_waiting_locks|hlog_db_connections|hlog_publish_jobs|hlog_publish_oldest_pending_age_seconds|hlog_publish_pending_age_unknown_jobs|hlog_publish_expired_leases|hlog_usage_known_cost_usd|hlog_usage_unknown_events|hlog_usage_included_events|hlog_usage_budget_usd|hlog_usage_budget_ratio|hlog_usage_budget_state|hlog_schedule_expected_enabled|hlog_schedule_enabled_timestamp_seconds|hlog_schedule_maintenance_from_timestamp_seconds|hlog_schedule_maintenance_until_timestamp_seconds|hlog_schedule_deadline_timestamp_seconds|hlog_autopublish_last_attempt_timestamp_seconds|hlog_autopublish_last_success_timestamp_seconds|hlog_autopublish_last_success_slot_timestamp_seconds|hlog_autopublish_last_budget_block_timestamp_seconds|hlog_batch_result|hlog_batch_stage
    - action: labelkeep
      regex: __name__|job|instance|source|state|job_type|importance|window|task|result|stage

- job_name: probe-exporter
  static_configs:
    - targets: [blackbox-exporter:9115]
  relabel_configs:
    - target_label: instance
      replacement: probe
  metric_relabel_configs:
    - source_labels: [__name__]
      action: keep
      regex: process_start_time_seconds

- job_name: http
  metrics_path: /probe
  params:
    module: [http_2xx]
  static_configs:
    - targets: [http://hlog-web:3000/]
      labels: {target: home}
    - targets: [http://hlog-web:3000/blog]
      labels: {target: blog}
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - target_label: __address__
      replacement: blackbox-exporter:9115
    - target_label: instance
      replacement: probe
  metric_relabel_configs:
    - source_labels: [__name__]
      action: keep
      regex: probe_success|probe_duration_seconds|probe_ssl_earliest_cert_expiry
    - action: labelkeep
      regex: __name__|job|instance|target
