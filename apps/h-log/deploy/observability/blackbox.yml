modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      body_size_limit: 1MB
      # Normal CA validation stays enabled. Local TLS tests mount their own CA.
