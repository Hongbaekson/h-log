# Optional drop-in; install only during the separately approved Step 7 activation.
[Service]
User=hlog-ops
Group=hlog-observe
SupplementaryGroups=docker
StateDirectory=hlog-observability
StateDirectoryMode=0750
UMask=0027
EnvironmentFile=/etc/hlog/observability.env
ExecStartPre=
ExecStartPre=-/usr/bin/python3 /opt/stacks/h-log/scripts/observability-state.py start
ExecStartPre=/usr/bin/docker compose -f compose.yaml -f compose.observability-publishing.yaml --profile scheduler run --rm --no-deps hlog-auto-publish npm run auth:preflight
ExecStart=
ExecStart=/usr/bin/docker compose -f compose.yaml -f compose.observability-publishing.yaml --profile scheduler run --rm -e HLOG_OBSERVABILITY_INVOCATION_ID=${INVOCATION_ID} hlog-auto-publish
ExecStopPost=-/usr/bin/python3 /opt/stacks/h-log/scripts/observability-state.py finish
