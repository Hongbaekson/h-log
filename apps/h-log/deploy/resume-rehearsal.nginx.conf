# Local rehearsal only. The certificate directory contains disposable localhost certificates.
proxy_cache_path /tmp/resume-cache keys_zone=resume:1m max_size=20m inactive=1m;
server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  location ~ ^/(admin|api/internal)(/|$) { return 404; }
  location / {
    proxy_pass http://resume-web:3000;
    proxy_set_header Host public-upstream;
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_set_header If-Match $http_if_match;
    proxy_cache resume;
    proxy_cache_valid 200 1m;
    add_header X-Test-Cache $upstream_cache_status always;
  }
}
server {
  listen 81 ssl;
  ssl_certificate /cert/local.crt;
  ssl_certificate_key /cert/local.key;
  server_name localhost;
  client_max_body_size 2m;
  add_header Cache-Control "private, no-store" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  location = /admin/resume/files {
    client_max_body_size 5m;
    client_body_timeout 30s;
    proxy_read_timeout 90s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://resume-web:3000;
    proxy_set_header Host localhost:3045;
    proxy_set_header X-Forwarded-Proto https;
  }
  location ~ ^/admin(/|$) {
    proxy_pass http://resume-web:3000;
    proxy_set_header Host localhost:3045;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
  }
  location /_next/static/ { proxy_pass http://resume-web:3000; }
  location / { return 404; }
}
