name: hlog

services:
  hlog-nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      hlog-web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - public_net
      - app_net
    restart: unless-stopped

  hlog-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hlog-web:dev
    env_file:
      - ${HLOG_RUNTIME_ENV_FILE:-./deploy/env.dev}
    expose:
      - "3000"
    depends_on:
      hlog-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net
      - data_net
    restart: unless-stopped

  hlog-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: hlog-worker:dev
    profiles:
      - worker
    env_file:
      - ${HLOG_RUNTIME_ENV_FILE:-./deploy/env.dev}
    command: ["npm", "run", "worker:once"]
    depends_on:
      hlog-postgres:
        condition: service_healthy
    networks:
      - app_net
      - data_net
      - egress_net
    restart: "no"

  hlog-auto-publish:
    build:
      context: .
      dockerfile: Dockerfile.auto-publish
    image: hlog-auto-publish:dev
    profiles:
      - scheduler
    env_file:
      - ${HLOG_AUTO_PUBLISH_ENV_FILE:-./deploy/env.dev}
    environment:
      HERMES_HOME: /opt/data
      HLOG_HERMES_COMMAND: hermes
      HLOG_WORKER_PUBLIC_BASE_URL: http://hlog-nginx
    volumes:
      - hermes_data:/opt/data
    depends_on:
      hlog-nginx:
        condition: service_started
      hlog-postgres:
        condition: service_healthy
    networks:
      - app_net
      - data_net
      - egress_net
    restart: "no"

  hlog-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: hlog-migrate:dev
    profiles:
      - tools
    env_file:
      - ${HLOG_RUNTIME_ENV_FILE:-./deploy/env.dev}
    depends_on:
      hlog-postgres:
        condition: service_healthy
    networks:
      - data_net
    restart: "no"

  hlog-dry-run:
    build:
      context: .
      dockerfile: Dockerfile
      target: dry-run
    image: hlog-dry-run:dev
    profiles:
      - dry-run
    env_file:
      - ${HLOG_RUNTIME_ENV_FILE:-./deploy/env.dev}
    environment:
      HLOG_DRY_RUN_BASE_URL: http://hlog-nginx
    depends_on:
      hlog-nginx:
        condition: service_started
      hlog-postgres:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    restart: "no"

  hlog-postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    env_file:
      - ${HLOG_POSTGRES_ENV_FILE:-./deploy/postgres.env.dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_net
    restart: unless-stopped

volumes:
  hermes_data:
  postgres_data:

networks:
  public_net:
  app_net:
    internal: true
  data_net:
    internal: true
  egress_net:
