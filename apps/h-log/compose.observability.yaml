# Opt in explicitly; usable alone for isolated local verification or as an overlay.
services:
  prometheus:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    profiles: [observability]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --query.timeout=10s
      - --query.max-concurrency=4
      - --log.level=warn
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13@sha256:41bbc1b5e04416f81891806076db2a2ff60a5d4da5f78d36a88b033a8c199185
    profiles: [observability]
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_USER: owner
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1m
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
    secrets: [grafana_admin_password]
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp:size=16m,uid=472,gid=0,mode=0700,noexec,nosuid,nodev
    networks: [monitoring_net, grafana_access_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 304m
    cpus: 0.20
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Docker 29 does not publish ports on internal-only containers. Keep Grafana
  # without egress and put only this fixed upstream gateway on a normal bridge.
  monitoring-gateway:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    profiles: [observability]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on:
      grafana:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HLOG_GRAFANA_PORT:-3030}:8080"
    volumes:
      - ./deploy/observability/gateway.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=4m,uid=101,gid=101,mode=0700,noexec,nosuid,nodev
    networks: [grafana_access_net, monitoring_access_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 16m
    cpus: 0.05
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

secrets:
  grafana_admin_password:
    file: ${HLOG_GRAFANA_PASSWORD_FILE:?Set an absolute secret file path outside the repository}

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring_net:
    internal: true
  grafana_access_net:
    internal: true
  monitoring_access_net:
